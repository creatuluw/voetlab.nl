type: Glossary
title: Glossary
description: Key terms for this project.
timestamp: "2026-07-29T17:16:52.594Z"

# Glossary

| Term | Definition |
|------|------------|
| pitchkit | The standalone, copyable football video-analytics framework this project ships. Python 3.10+, MIT. |
| PREDA | The product (statspreda.com) that pitchkit powers — broadcast-footage match analytics. |
| Result | The universal success indicator (\`core.result\`). Every feature returns \`Result.Ok(value, **meta)\` / \`Result.Fail(error, **meta)\`; \`bool(result)\` reads success. |
| Provenance | Frame traceability (\`core.provenance.attach_provenance\`). Stamps each event with the \`source_frames\` it came from. |
| Feature | A single pipeline unit, one per file, registered via \`@feature(name, deps=[...])\`. |
| PipelineState | The shared clipboard the runner threads between features; each result lands in \`state.data[name]\`. |
| \`run\` / \`run_feature\` | Top-level API. \`run(video)\` = full default graph; \`run_feature(name, video)\` = isolate one stage. |
| \`compare\` | Runner helper that diffs two metric snapshots for before/after analysis. |
| DEFAULT_FEATURES | The default pipeline graph; includes \`reliability\`, so every run auto-emits per-stat confidence. |
| SAHI | Sliced Aided Hyper Inference. N× tiled inference that lifts ball recall from ~1% (COCO) to ~98% with a specialist model. |
| Ball recall / coverage | Fraction of frames the real ball is detected on — the key CV-quality signal feeding reliability. |
| TVCalib | Full broadcast-camera solver (WACV23, MM4SPA/tvcalib) that yields an accurate pixel→metre homography. |
| Homography | The 3×3 transform mapping broadcast pixels to real pitch metres (105×68 m); unlocks true-pitch stats, heatmaps, tactics. |
| DLT | Direct Linear Transform — the line-correspondence homography fallback (SoccerNet/sn-calibration baseline). |
| Metric space | Real-world pitch coordinates (metres) as opposed to raw pixel coordinates. |
| ByteTrack / BoT-SORT | Multi-object trackers. ByteTrack (supervision) is default; BoT-SORT/OC-SORT (ultralytics) via the tracker factory adds CMC/ReID. |
| ID fragmentation | A tracking failure where one player gets many IDs across pan/zoom — degrades per-player stats. |
| Pitch control | (Tactics) Spearman-style field giving P(team A controls) at each pitch point from player reach/time-to-reach. |
| Voronoi / dominant region | (Tactics) Tessellation of the pitch into each player's nearest territory; yields team-area ratio. |
| Reliability signal | PREDA's product moat: an honest, automatic per-stat confidence derived from measurable CV-quality (ball coverage, tracking stability, interpolation ratio, calibration confidence). |
| Footage-driven test | A feature's co-located test that runs on \`football-1.mp4\`, asserts \`Result.ok\`, and dumps artifacts to \`tests/out/<feature>/\`. |
| \`[vision]\` / \`[viz]\` / \`[dev]\` | Optional extras in \`pyproject.toml\`: vision = ultralytics+supervision; viz = matplotlib+mplsoccer; dev = pytest. |
| OKF | The knowledge-wiki bundle format this \`docs/wiki/\` follows (concepts, decisions, rules, learnings, preferences). |

  "overview.md": `---
type: System Overview
title: Overview
description: What this project contains and its structure.
timestamp: "2026-07-29T17:16:52.594Z"
---

# Overview

**pitchkit** is a standalone, copyable football video-analytics framework written in Python
(3.10+). Broadcast video goes in; player and ball detection, multi-object tracking, pitch
calibration, event detection, physical and tactical stats, a per-stat reliability signal, and
charts come out. It is the engine of **PREDA** (statspreda.com) — a product that turns
broadcast footage into trustworthy match analytics. The original Telegram-bot prototype lives
untouched in a sibling \`src/\`; pitchkit is a separate, self-contained package you can either
\`pip install -e .\` or copy folder-for-folder into another project (no repo-specific imports).

The project is organized around three invariants, enforced everywhere: **one distinct feature
per file**, grouped into a **folder per domain** (\`core\`, \`detection\`, \`tracking\`,
\`calibration\`, \`events\`, \`stats\`, \`tactics\`, \`reliability\`, \`viz\`, \`pipeline\`); **every feature
returns a \`core.result.Result\`** success-indicator so \`bool(result)\` reads success and a failing
stage is *flagged, never crashed*; and **every event carries frame provenance** via
\`core.provenance\`, so any pass/tackle/interception traces back to the exact footage frame. Each
feature file also has a co-located **footage-driven test** that runs on the canonical clip
\`football-1.mp4\` and dumps inspectable artifacts under \`tests/out/<feature>/\`.

Execution is a **dependency-ordered pipeline runner** (\`pitchkit/pipeline/\`). Features register
with \`@feature(name, deps=[...])\`; the runner topologically orders them, threads a shared
\`PipelineState\` clipboard, collects each \`Result\`, and isolates failures so the whole run still
completes. \`pitchkit.run(video)\` runs the default graph end-to-end; \`pitchkit.run_feature(name,
video)\` isolates a single stage; \`compare(baseline, current)\` diffs metric snapshots for
before/after analysis. The top-level API is the thin re-export in \`pitchkit/__init__.py\`.

The repository root mixes four concerns: the **\`pitchkit/\` package** itself (41 source modules +
their tests), **\`docs/\`** (a from-scratch build guide, a development log, a raw session
transcript, a generated self-contained HTML site, and this OKF knowledge wiki), **\`tests/\`**
(repo-level smoke tests plus sample output artifacts), and **project metadata** (\`pyproject.toml\`,
the editable-install \`pitchkit.egg-info/\`, \`FEATURES.md\` auto-manifest, \`llms.txt\` LLM brief,
and \`README.md\`). High-recall ball detection (SAHI + a specialist model, ~98% vs ~1% for COCO)
and accurate metric calibration (the TVCalib full camera solver → real metres) are opt-in via
\`meta\` knobs; without them the pipeline degrades gracefully (pixels instead of metres, standard
YOLO ball). The full suite is \`python -m pytest pitchkit -q\` → 121 tests.
