# Glossary

| Term | Definition |
|------|------------|
| voetlab | The standalone, copyable football video-analytics framework that is the engine behind voetlab.nl. |
| Result | The universal success indicator (\`core.result.Result\`) returned by every feature; has \`ok / value / error / meta\`; \`bool(result)\` reads success. |
| Feature | A distinct pipeline unit; one feature per file, registered via \`@feature(name, deps=[...])\`. |
| Pipeline / runner | The dependency-ordered executor (\`pipeline/runner.py\`) that threads a shared \`PipelineState\`, collects \`Result\`s, and flags failures without crashing. |
| PipelineState | The shared "clipboard" the runner threads between features; each feature's \`Result.value\` lands in \`state.data[name]\` for downstream readers. |
| Provenance / source_frames | Frame index(es) stamped onto every event via \`core.provenance\` so any event traces back to the footage. |
| Footage-driven test | A per-feature test that runs on the canonical \`football-1.mp4\` clip, asserts \`Result.ok\`, and dumps artifacts to \`tests/out/<feature>/\`. |
| Graceful failure | A failing feature is flagged in \`res.value["failed"]\` rather than raising; the run completes and reports all failures. |
| run / run_feature | Top-level API: \`run(video)\` runs the full pipeline; \`run_feature(name, video)\` isolates one stage. |
| meta | The optional \`meta\` dict passed to a run, carrying opt-in knobs like \`ball_model_path\`, \`ball_method\`, \`calib_checkpoint\`, \`tvcalib_path\`, \`max_frames\`, \`fps\`, \`width\`. |
| Detection | Per-frame YOLO inference of persons (COCO class 0) and ball; the first pipeline stage. |
| detect_ball / SAHI | Sliced (tiled) inference with a specialist football-ball model yielding ~98% ball-frame recall vs ~1–18% for stock COCO class 32. |
| Track (player tracker) | ByteTrack multi-object tracking over person boxes; produces per-frame \`track_id\`-bearing entries. |
| ID fragmentation | ByteTrack assigning a single player many IDs across a pan/zoom — degrades per-player stats; the reason BoT-SORT (T9) is offered. |
| Ball tracker / ball trajectory | Ball-per-frame output; linear interpolation (default) or Kalman constant-velocity (\`ball_method="kalman"\`, T6); synthetic points carry \`confidence=0.0\`. |
| Team classifier | KMeans k=2 on median HSV torso color, with circular hue (T1) and per-track majority vote (T2) stabilization. |
| Role filter | Pure bbox-centroid geometry heuristics labeling each track \`player\` / \`gk\` / \`referee\` (T3). |
| Homography (H) | The 3×3 image→template (broadcast px → real-world metres) mapping; computed by keypoints+DLT or the TVCalib solver. |
| IFAB pitch | The reference pitch dimensions (105 m × 68 m) used as the template for calibration. |
| Keypoint | A pitch-landmark point detected on the broadcast frame, paired with its known template coordinate to estimate the homography. |
| DLT-from-lines | Direct Linear Transform homography estimated from line correspondences (SoccerNet/sn-calibration baseline). |
| TVCalib | The WACV'23 full camera solver (AdamW, ~2000 steps) that projects a template ground grid through a solved camera to derive an accurate H; the primary calibration path. |
| calibrate | The calibration feature that samples frames, runs the TVCalib solver (τ=0.05 loss gate) with DLT fallback (reproj < 15 m), and publishes \`H\` to \`state.meta\`. |
| metric (space) | Real-world metres coordinates obtained by warping pixel tracks (player feet) through \`H\`; what unlocks true distance/speed/heatmaps. |
| Events | On-ball actions (possession, passes, tackles, interceptions) derived from tracks+ball+teams, each frame-provenanced. |
| Stats | Terminal per-player/per-team aggregates: distance, top speed, sprints, pass/tackle/possession counts (pixels unless calibrated). |
| Pitch control | Spearman model giving P(team A controls) per pitch cell from time-to-reach influence (T11). |
| Voronoi / dominant region | Tessellation giving each team's nearest-player territory area ratio (T12). |
| Reliability signal | voetlab's per-stat 0–1 confidence propagated from measurable CV-quality inputs (ball coverage, interpolation ratio, track fragmentation, homography conf). |
| homography_conf | A reliability input currently hardcoded to \`1.0\` (not yet wired from calibration) — see the reliability learning. |
| tracking_stability | A reliability proxy = \`1 − max(0, n_tracks − 22)/22\`; a fragmentation indicator, not a true tracker-quality metric. |
| viz / charts | mplsoccer adapters producing matplotlib \`Figure\` objects (heatmap, pass network, radar); headless, no UI. |
| DEFAULT_FEATURES | The wired default graph, which includes \`reliability\`, so every run auto-emits a per-stat confidence. |
| compare | A runner helper that diffs two metric snapshots (baseline vs current) for before/after analysis. |
| T-codes (T1–T13) | Upgrade task identifiers in the dev log (e.g. T4=homography, T6=Kalman ball, T8=SAHI ball, T9=BoT-SORT, T11=pitch control, T12=Voronoi, T13=charts). |
| OKF | The Open Knowledge Format used for \`docs/wiki/\` — frontmatter-typed concepts (Decisions, Rules, Learnings, Preferences, Pages). |

# Canonical repo location and gitignore policy

The \`voetlab\` framework (working dir \`voetlab.nl/\`) is now hosted at
**https://github.com/creatuluw/voetlab.nl** on the \`main\` branch, under the
\`creatuluw\` account. The repo was initialized from a non-git tree and pushed as
a single commit of 131 files.

## \`.gitignore\` policy — what counts as regenerable here

\`.gitignore\` excludes regenerable build/test artifacts, machine-local state, and one size-limited binary-asset dir. Source code is never ignored; data is ignored only when a file would bust a size limit:

- \`__pycache__/\` — compiled Python bytecode
- \`.pytest_cache/\` — pytest run cache
- \`*.egg-info/\` — editable-install metadata (\`voetlab.egg-info/\`), regenerated by \`pip install -e .\`
- \`tests/out/\` — per-feature inspectable artifacts dumped by the footage-driven tests; regenerated on every \`pytest\` run
- \`.pi/\` — pi coding-agent session/config state for this project (todos, etc.); machine-local, never shared across machines
- \`voetlab/external/tvcalib/data/\` — the ~467 MB TVCalib calibration checkpoint; excluded on **size** (exceeds GitHub's 100 MB limit), not reproducibility — see [[rules/gitignore-large-checkpoints-document-the-download-instead]]

Rationale: every excluded path is reproducible from the tree itself, so the
commit stays clean of machine-local state. \`docs/\` (including the build guide,
dev log, raw transcript, generated HTML site, and this OKF wiki) is tracked,
along with the full \`voetlab/\` package and \`tests/\` source.

## Deliberately skipped at push time

\`.github/\` CI workflows, \`LICENSE\`, and branch protection were NOT added — add
these when CI or formal licensing is wanted.

# detect_ball slice_size vs ball recall on 1080p

The \`detect_ball\` (SAHI) stage's speed is dominated by the slice count, which is set by
\`slice_size\` against the frame resolution. Measured on \`football-1.mp4\` (1920x1080), 40 frames,
martinjolif ball model, SAHI overlap 0.2:

| slice_size | slices | ms/frame | ball-rate (conf 0.15) | ball-rate (conf 0.10) |
|------------|--------|-----------|------------------------|------------------------|
| 512 (old)  | 15     | ~258      | 100%                   | 100%                   |
| 640        | 8      | ~163      | 78%                    | 90%                    |
| 768 (new)  | 6      | ~133      | 92%                    | 98%                    |
| 960        | 6      | ~150      | 85%                    | 95%                    |
| 1280       | 2      | —         | ~50%                   | —                      |

**Chosen default: \`slice_size=768, conf=0.10\`** — 6 slices (was 15), ~1.9x faster, ball-rate
held at ~98% (within the 10% recall budget). Two non-obvious facts:

1. **Why conf must drop to 0.10 as slices grow:** a 1920x1080 broadcast frame's ball is small;
   at larger \`slice_size\` the ball occupies a smaller fraction of each patch, so the model's
   confidence dips below the old 0.15 threshold and the ball is dropped. The specialist
   martinjolif model has high precision, so 0.10 adds essentially no false positives (box count
   stays ~104 vs baseline ~113).

2. **The "2–4 slices" target is NOT reachable on 1080p:** square-slice SAHI grids for 1920x1080
   step 15 → 12 → 8 → 6 → 2 (there is no 4-slice config). The 2-slice grid (slice_size>=1280)
   collapses ball recall to ~50% — the ball becomes too small per patch to detect. So 6 slices
   (768) is the recall-preserving floor.

Ceiling (also in the \`# ponytail:\` comment in detect.py): do not raise \`slice_size\` past 960
without re-measuring recall, and keep \`conf <= 0.10\` once slices grow. Both knobs stay
controllable via \`meta["slice_size"]\` / \`meta["conf"]\`. SAHI auto-collapses to a single
full-frame slice when \`slice_size >= max(H, W)\`, so genuinely small frames need no special
"skip-slicing" code.

Source: \`voetlab/detection/detect.py\` (\`detect_ball_sahi\`, \`_run_sahi\`).

# Model weights are hosted at voetlab.nl/models

voetlab's model weights are **large binaries that are not committed to git** — the
calibration checkpoint alone is ~488 MB (over GitHub's 100 MB file limit). They live in a
consolidated \`models/\` folder at the repo root (git-ignored: \`.gitignore\` → \`/models/*.pt\`;
only \`models/README.md\` is tracked) and are mirrored on the project's static host for
download.

## Canonical download host — VERIFIED WORKING

**https://voetlab.nl/models/** — confirmed serving every weight (HTTP 200, correct sizes):

| File | Size | Runtime key | Purpose |
|------|------|-------------|---------|
| \`yolov8s.pt\` | ~21.5 MB | \`meta["model_path"]\` | Default YOLO detector (persons + ball) |
| \`martinjolif_ball.pt\` | ~5.3 MB | \`meta["ball_model_path"]\` | High-recall SAHI football-ball model (~98%) |
| \`rajatdave_ball.pt\` | ~6.1 MB | \`meta["ball_model_path"]\` | Alternate ball model |
| \`yaku_ball.pt\` | ~6.0 MB | \`meta["ball_model_path"]\` | Alternate ball model |
| \`tvcalib_calib_train59.pt\` | ~488 MB | \`meta["calib_checkpoint"]\` | TVCalib calibration checkpoint → metres |

\`\`\`bash
for f in yolov8s.pt martinjolif_ball.pt tvcalib_calib_train59.pt; do
  curl -L -o "models/$f" "https://voetlab.nl/models/$f"
done
\`\`\`

> ⚠️ When this was verified, the served \`tvcalib_calib_train59.pt\` was ~543 KB smaller than
> the local copy — possibly a truncated FTP upload. Re-upload if \`torch.load\` fails on it.

## Why voetlab.nl and NOT te9.dev

The weights were first tried on \`te9.dev/voetlab/models/\`, which **404s**: \`te9.dev\` is served
by a **SvelteKit/Node app** (apex → AWS Global Accelerator; \`www.te9.dev\` → \`Server:
railway-hikari\`, i.e. Railway.app). Neither is a static-file host, so files FTP'd to
\`/public_html/te9.dev/...\` on disk are not web-accessible — the app returns its own 404.

\`voetlab.nl\` (and \`www.voetlab.nl\`) DNS → \`92.205.3.167\`, an **Apache** shared-host box that
serves the \`/models/\` path directly (200 + correct \`Content-Length\`, range support). That is
why the canonical URL is \`voetlab.nl/models/\`.

## Why it matters

Anyone (dev or LLM) running the full pipeline must fetch weights from the host — they are
neither \`pip install\`ed nor pulled from git. Without \`ball_model_path\` the run degrades to
~1–18% ball recall; without \`calib_checkpoint\` it stays in pixels (no metres). Documented in
\`README.md\` (## Models & weights), \`llms.txt\` (## Model weights), and \`models/README.md\`.

## Runtime resolution

The package resolves its own default locations in \`voetlab/paths.py\`
(\`voetlab/models/*\`, \`voetlab/external/tvcalib/data/.../train_59.pt\`), but every weight is
**overridable via \`meta\` keys**, so a deployment that downloads from the host just points
those keys at the download location.

# Models folder is an FTP deploy bundle, not the runtime source

## The fact

There is a top-level **\`models/\`** folder at the repo root holding **every** weight
the framework needs as one uploadable bundle (~506 MB total):

| File | Runtime \`meta\` key |
|------|--------------------|
| \`yolov8s.pt\` | \`meta["model_path"]\` |
| \`martinjolif_ball.pt\` | \`meta["ball_model_path"]\` |
| \`rajatdave_ball.pt\` | \`meta["ball_model_path"]\` |
| \`yaku_ball.pt\` | \`meta["ball_model_path"]\` |
| \`tvcalib_calib_train59.pt\` | \`meta["calib_checkpoint"]\` |

**This folder is NOT the runtime source of truth.** The code still reads weights
from its original locations — \`voetlab/models/\` (detection) and
\`voetlab/external/tvcalib/data/segment_localization/train_59.pt\` (calibration),
all resolved via the \`meta\` path keys / \`voetlab/paths.py\`. \`models/\` is a
**duplicate copy** assembled purely so the weights can be FTP'd up as one bundle.

## What was done about it

- \`/models/*.pt\` added to \`.gitignore\` — the binaries are deploy assets, kept out
  of git (same reasoning as [[rules/gitignore-large-checkpoints-document-the-download-instead]]).
- \`models/README.md\` is **tracked** and documents the manifest, the runtime \`meta\`
  keys, and how to re-populate the folder — so the tree still tells you what's
  supposed to be there even though the \`.pt\` files aren't version-controlled.
- Upload: \`mput models/*.pt\` to FTP. Consume at deploy: point the \`meta\` keys (or
  \`voetlab/paths.py\`) at the downloaded location.

## Why this matters

- **"Why are the weights in two places?"** — \`voetlab/models/\` (+ tvcalib external)
  is what the runtime reads; \`models/\` is the FTP upload bundle. The duplication is
  deliberate, not stale duplication to delete.
- **"Why is \`models/\` gitignored but its README tracked?"** — same size logic as
  [[learnings/tvcalib-calibration-checkpoint-is-gitignored-not-in-history]]: a
  467 MB \`.pt\` can't live in git history; the README stays so the manifest is
  reproducible.

## Open question (deferred)

Whether \`models/\` should become the **single source of truth** the code reads from
(deprecating \`voetlab/models/\`, rewiring \`paths.py\` + \`MANIFEST.in\`) was raised as
an open question and **not decided**. Until then, treat the duplication as
intentional. See [[learnings/canonical-repo-location-and-gitignore-policy]] for the
broader gitignore policy.

type: Learning
title: Reliability signal has a hardcoded component
description: The \`reliability\` domain publishes a per-stat trust signal, but not all of its
tags: [reliability, calibration, gotcha, limitation]

# Reliability signal has a hardcoded component

The \`reliability\` domain publishes a per-stat trust signal, but not all of its
components are actually measured. Reading the source (\`voetlab/reliability/\`)
reveals two honest limitations that affect how the composite scores should be
interpreted:

- **\`homography_conf\` is hardcoded to \`1.0\`** — it does NOT reflect how good the
  pitch calibration actually was. So a run with a shaky/failed \`H\` still reports
  full confidence on the calibration axis.
- **\`tracking_stability\` is a proxy**, not a true tracker-quality metric — it's
  derived from tracking output heuristics rather than a ground-truth comparison.

The genuinely measured components are \`ball_coverage\`, \`interpolation_ratio\`,
and the composites built from them.

**Why it matters:** Anyone building on voetlab/voetlab stats or debugging
"why is reliability X?" must know the calibration axis of the reliability score
is currently a constant, not a real signal. Documented (as of the refreshed
README) in \`voetlab/reliability/README.md\` under Quality & limitations.
`,

# TVCalib calibration checkpoint is gitignored, not in history

## The fact

\`voetlab/external/tvcalib/data/segment_localization/train_59.pt\` is a
**~467 MB** calibration checkpoint. It **exceeds GitHub's 100 MB hard file
limit**, so it can never be committed with a plain \`git add\` — a push
containing it fails outright.

## What was done about it

The entire \`voetlab/external/tvcalib/data/\` directory was added to
\`.gitignore\` (with a comment pointing to \`docs/BUILD_FROM_SCRATCH.md\` Phase 14,
where the checkpoint is downloaded). The checkpoint still lives on disk and the
code still references it via \`meta["calib_checkpoint"]\` — it is just not
version-controlled.

## Why this matters

- **"Why isn't \`train_59.pt\` in the repo?"** — because it's 467 MB and would
  fail the push. Get it via BUILD_FROM_SCRATCH.md Phase 14.
- **"Why did a \`commit and push all\` skip \`external/\`?"** — same reason. The
  lazy \`git add -A\` had to exclude this one dir.
- The upgrade path to bring it under version control is **Git LFS**
  (\`git lfs track "*.pt"\`), deferred until reproducible CI needs it.

See [[rules/gitignore-large-checkpoints-document-download-instead]] for the
general convention.

  "overview.md": `---
type: System Overview
title: Overview
description: What this project contains and its structure.
timestamp: "2026-07-29T20:21:57.442Z"
---

# Overview

**voetlab** is a standalone, copyable football video-analytics framework written in Python
(3.10+). It turns broadcast football video into structured analytics: player and ball
detection, multi-object tracking, pitch calibration, on-ball events, physical and tactical
statistics, a per-stat reliability signal, and charts. It is the engine behind
**voetlab.nl** and is shipped as a self-contained package — \`pip install -e .\` or simply copy
the inner \`voetlab/\` folder into any project and \`import voetlab\`. The top-level \`README.md\`
and \`llms.txt\` are the human- and machine-facing entry points; \`pyproject.toml\` declares the
minimal core dependencies (numpy, opencv-python, scipy, scikit-learn, filterpy) with optional
\`[vision]\` (ultralytics + supervision), \`[viz]\` (matplotlib + mplsoccer), and \`[dev]\`
(pytest) extras.

The code lives entirely under \`voetlab/\`, organized as **one distinct feature per file, one
folder per domain**. The domains form a pipeline: \`core/\` (shared contracts — the \`Result\`
success indicator, frame provenance, footage test harness) → \`detection/\` (YOLO person+ball
detection, plus a high-recall SAHI ball detector) → \`tracking/\` (player/ball trackers, Kalman
ball trajectory, team classifier, role filter, tracker factory) → \`calibration/\` (homography
engine, keypoints, DLT-from-lines, and the accurate TVCalib full camera solver that yields
real metres) → \`events/\` (possession, passes, tackles, interceptions) → \`stats/\` (physical
and aggregate stats) → \`tactics/\` (Spearman pitch control, Voronoi territory) →
\`reliability/\` (per-stat confidence) → \`viz/\` (mplsoccer charts). The \`pipeline/\` package
wires these into a dependency-ordered, isolated runner with graceful failure, and \`report.py\`
provides a one-command JSON+charts report generator.

The project is built test-first: 121 tests, with **every feature file carrying a co-located
footage-driven test** that runs on a canonical \`football-1.mp4\` clip and dumps inspectable
artifacts to \`tests/out/\`. Two key conventions run through the whole codebase: every feature
returns a \`core.result.Result\` (so \`bool(result)\` reads success and a failing feature is
flagged, never crashes the run), and every event carries frame provenance (\`source_frames\`).
High-recall ball detection (SAHI + a specialist model, ~98% vs ~1–18% for stock COCO) and
accurate metric calibration (TVCalib full solver) are opt-in via \`meta\` keys; without them the
pipeline degrades gracefully to pixels and standard YOLO detection.

Documentation is extensive and tracked under \`docs/\`: \`README.md\` / \`FEATURES.md\` (install +
auto-generated feature manifest), \`DEVELOPMENT_LOG.md\` (how it was built — phases, measured
quality wins, bugfixes), \`BUILD_FROM_SCRATCH.md\` (ordered TDD-locked todos to reproduce the
framework exactly), \`site/index.html\` (a self-contained reference HTML site), and the
\`docs/wiki/\` OKF knowledge bundle holding decisions, rules, learnings, preferences, glossary,
and an annotated architecture file tree. Build/test artifacts (\`__pycache__/\`,
\`.pytest_cache/\`, \`tests/out/\`, \`*.egg-info/\`) and the pi harness state (\`.pi/\`) are
git-ignored as regenerable or machine-local.

## Major subsystems

- **core** — \`Result\` success indicator, frame provenance, footage test harness.
- **detection** — YOLO detection + the validated high-recall \`detect_ball\` (SAHI).
- **tracking** — player/ball trackers, Kalman trajectory, team classifier, role filter, tracker factory.
- **calibration** — homography engine, keypoints, TVCalib solver → metres.
- **events** — possession/passes/tackles, every event frame-provenanced.
- **stats** — physical + aggregate stats (pixels + metres when calibrated).
- **tactics** — pitch control + Voronoi (activate when calibrated).
- **reliability** — per-stat confidence (the voetlab signal).
- **viz** — mplsoccer chart adapters.
- **pipeline** — registry, runner (isolation + downstream + compare), default graph, CLI.

type: Rule

description: Guideline

# Gitignore large checkpoints, document the download instead

## Guideline

Never \`git add\` model checkpoints or binary weights that are large (roughly
tens of MB or more), and **never** anything over **GitHub's 100 MB hard file
limit** — a single oversized file makes the whole \`git push\` fail. Instead:

1. Add the asset's directory to \`.gitignore\`, with a comment naming what it is
   and pointing to the download step.
2. Document the download command in \`docs/BUILD_FROM_SCRATCH.md\` (the relevant
   Phase), so the tree stays reproducible without the binary in history.

## When it applies

Whenever you're about to stage vendored models, calibration checkpoints, or any
third-party binary asset — e.g. the TVCalib \`train_59.pt\`, YOLO \`.pt\` weights.
This is a *different* \`.gitignore\` category from the regenerable
build/test-artifact ignores (see
[[learnings/canonical-repo-location-and-gitignore-policy]]): these files are
**not** reproducible from the tree, they are excluded purely on **size**.

## Rationale

Committing a 467 MB \`.pt\` into git history would (a) fail the push outright at
GitHub's 100 MB ceiling, and (b) bloat the repo permanently even if it
succeeded. A \`.gitignore\` line + a download pointer in the build guide is the
smallest working solution: the asset lives on disk, the code still references
it, but it is not version-controlled.

## Upgrade path

If a checkpoint genuinely needs to be under version control (reproducible CI,
no manual download), the proper path is **Git LFS** (GitHub: 1 GB free):

\`\`\`bash
git lfs install
git lfs track "*.pt"
git add .gitattributes
git add <the-checkpoint.pt>
\`\`\`

Only adopt LFS when the manual-download workflow actually hurts — until then,
gitignore + download doc wins on simplicity.
`,

type: Rule
title: Keep .wiki_ignore in sync with noise directories
description: When (re)generating \`docs/wiki/architecture/file-tree.md\`, ensure regenerable / noise

# Keep .wiki_ignore in sync with noise directories

When (re)generating \`docs/wiki/architecture/file-tree.md\`, ensure regenerable / noise
directories are listed in \`.wiki_ignore\`, not just \`.gitignore\`. The two files serve
different purposes:

- \`.gitignore\` — what **git** ignores (version control).
- \`.wiki_ignore\` — what the **wiki file-tree annotator** walks when building the annotated tree page.

## Guideline

Before regenerating the file tree, add any path that would flood the tree with
hundreds of identical or machine-local entries. Currently this includes:

- \`.git/\` — the git object store; without exclusion the tree sprouts ~300
  indistinguishable \`.git/objects/<hash>\` entries.
- \`tests/out/\` — per-feature inspectable test artifacts, regenerated on every
  \`pytest\` run.

## Rationale

A skimmable, per-entry-annotated file tree is the whole point of the page. A
single \`.git/\` omission turns it into ~300 lines of hash noise that bury the
real source paths. The wiki annotator does not read \`.gitignore\`, so ignoring
\`.git/\` at the VCS level is not enough — \`.wiki_ignore\` is the lever.

## Related

- [[learnings/canonical-repo-location-and-gitignore-policy]] — covers what **git** ignores; this rule covers the wiki annotator's separate exclude list.

  "rules/per-frame-pipeline-stages-emit-throttled-progress-via-state-.md": `---
type: Rule
title: Per-frame pipeline stages emit throttled progress via state.progress
description: "Stages with a per-frame loop emit progress events through the optional \`state.progress\` callback (a \`Callable[[dict], None]\`, default \`None\`). The runner always"
tags: [pipeline, progress, web-ui, tracking]
timestamp: "2026-07-29T20:38:34.575Z"
---

# Per-frame pipeline stages emit throttled progress via state.progress

Stages with a per-frame loop emit progress events through the optional \`state.progress\` callback (a \`Callable[[dict], None]\`, default \`None\`). The runner always emits \`{"type":"start","stage":...}\` and \`{"type":"stage_done","stage":...}\` around every stage; per-frame stages additionally emit \`{"type":"frame","stage":<name>,"currentFrame":i,"totalFrames":n}\`.

Convention for the per-frame \`frame\` events:
- \`currentFrame\` is **1-indexed** (matches \`detect\`).
- \`totalFrames\` = the count the loop iterates (\`len(frames)\`, \`meta["total_frames"]\`, the \`sample_frames\` cap for \`teams\`, or the sampled-frame count for \`calibrate\`) — NOT the whole clip when the stage only scans a window.
- **Throttle to ~every 20 frames** (\`if i % 20 == 0\`) for stages over many frames so the SSE isn't flooded. \`detect\` is the exception: it emits every frame (it's the heaviest entry stage).
- **Always emit one final \`frame\` event at the loop's end** (\`currentFrame == totalFrames\`) so the UI bar completes — even if the throttle already fired there (idempotent duplicate is harmless) or the clip was shorter than the window.
- Guard every emit with \`if state.progress:\` — the callback is optional and \`None\` in tests/CLI, so there must be zero overhead when absent.

Stages currently emitting per-frame progress: \`detect\` (every frame), \`detect_ball\` (throttled every ~20 frames + final; the high-recall SAHI ball stage, \`stage="detect_ball"\` — was previously the one per-frame stage with NO callback, freezing the web UI), \`calibrate\` (every sampled frame), \`track\` (throttled), \`ball\` (throttled on the Kalman path; single completion on the fast linear path since it has no expensive loop), \`teams\` (throttled over the \`sample_frames\` cap). Aggregation stages (\`events\`, \`stats\`, \`reliability\`) have no per-frame loop and rely on \`start\`/\`stage_done\` only.

Source: \`voetlab/detection/detect.py\`, \`voetlab/calibration/features.py\`, \`voetlab/tracking/player_tracker.py\`, \`voetlab/tracking/ball_tracker.py\`, \`voetlab/tracking/ball_trajectory.py\`, \`voetlab/tracking/team_classifier.py\`.

# Remove all references when deleting a wiki concept

## Guideline

When deleting a wiki concept (any \`.md\` under \`decisions/\`, \`learnings/\`, \`rules/\`,
\`pages/\`), also remove **every reference to its slug** — otherwise you ship dangling links
that break navigation and link-checking.

## Where references hide in this setup

- \`docs/wiki/index.md\` — the Navigation map bullets (\`concept-id — title — description\`).
- \`docs/wiki/<folder>/index.md\` — per-folder index bullets (e.g. \`learnings/index.md\`,
  \`decisions/index.md\`).
- \`docs/wiki/changelog/YYYY-MM.jsonl\` — the entry that logged the concept's creation.
- \`[[slug]]\` wikilinks inside sibling concept bodies.

## How to do it

1. Note the exact slug(s) being removed.
2. Grep repo-wide for each slug (not just \`docs/wiki/\`).
3. Delete the \`.md\` file(s).
4. Strip the matching bullets/lines/entries from index + changelog.
5. Re-grep to confirm **zero matches** before committing.

## Why

Deleting only the \`.md\` leaves index bullets and changelog lines pointing at files that no
longer exist — the OKF link-check (\`wiki_validate\`) flags these as broken links (W4) and the
navigation map becomes misleading. Cleaning up at deletion time is far cheaper than hunting
dangling refs later.
